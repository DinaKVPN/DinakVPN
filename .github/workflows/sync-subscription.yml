name: 🔄 Auto Sync Subscription

on:
  schedule:
    - cron: '0 */6 * * *'     # каждые 6 часов
  workflow_dispatch:          # можно запустить вручную

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🌐 Скачиваем свежую подписку
        run: |
          curl -s -L "${{ secrets.SOURCE_SUB_URL }}" -o https://mygala.ru/vpn/premium.php

      - name: 🔍 Сравниваем и обновляем
        run: |
          if [ -f https://mygala.ru/vpn/premium.php ]; then
            if ! cmp -s vpn/subscription.txt vpn/subscription_new.txt 2>/dev/null; then
              mv https://mygala.ru/vpn/premium.php vpn/subscription.txt
              git config user.name "GitHub Actions Bot"
              git config user.email "actions@github.com"
              git add vpn/subscription.txt
              git commit -m "🔄 Auto-sync: обновлена подписка ($(date +'%Y-%m-%d %H:%M'))"
              git push
              echo "✅ Подписка обновлена!"
            else
              rm https://mygala.ru/vpn/premium.php
              echo "ℹ️ Изменений нет"
            fi
          else
            echo "❌ Не удалось скачать источник!"
            exit 1
          fi
